# Worker role: writes the code.
# Run inside a pane labelled "worker": herdr pane rename <pane_id> worker
# Path assumes `pi install git:...`; override with PI_DEV_BUNDLE if you use a
# checkout or a vendor directory.
PDB="${PI_DEV_BUNDLE:-$HOME/.pi/agent/git/github.com/HYPERVAPOR/pi-dev-bundle}"
PROFILE=(
	-e "$HOME/.pi/agent/extensions/herdr-agent-state.ts"
	-e "$PDB/extensions/keepctx.ts"
	-e "$PDB/extensions/copy-code.ts"
	--tools read,write,edit,ls,bash
	--append-system-prompt "$HOME/.pi/agent/pi-rules/worker.md"
)
