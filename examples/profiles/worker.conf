# Worker role: writes the code.
# Run inside a pane labelled "worker": herdr pane rename <pane_id> worker
# Path assumes `pi install git:...`; override with HERDR_PAIR if you use a
# checkout or a vendor directory.
PDB="${HERDR_PAIR:-$HOME/.pi/agent/git/github.com/HYPERVAPOR/herdr-pair-coding}"
export PI_ROLE=worker
PROFILE=(
	-e "$HOME/.pi/agent/extensions/herdr-agent-state.ts"
	-e "$PDB/resume-profile/resume_argv.ts"   # restore this pane as this profile, not bare pi
	-e "$PDB/role-guard/role_guard.ts"
	# Optional everyday tools (separate package):
	# -e "$HOME/.pi/agent/git/github.com/HYPERVAPOR/pi-utils/extensions/keepctx.ts"
	# -e "$HOME/.pi/agent/git/github.com/HYPERVAPOR/pi-utils/extensions/copy-code.ts"
	--tools read,write,edit,ls,bash
	--append-system-prompt "$HOME/.pi/agent/profiles/worker.md.example"
)
