# Reviewer role: reads the worker's answer and pushes back.
# Run inside a pane labelled "reviewer": herdr pane rename <pane_id> reviewer
# last_answer reads another herdr pane; hb_block silences the watchdog while
# the pair is talking to a human.
PDB="${PI_DEV_BUNDLE:-$HOME/.pi/agent/git/github.com/HYPERVAPOR/pi-dev-bundle}"
PROFILE=(
	-e "$HOME/.pi/agent/extensions/herdr-agent-state.ts"
	-e "$PDB/extensions/keepctx.ts"
	-e "$PDB/extensions/copy-code.ts"
	-e "$PDB/herdr-last-answer/last_answer.ts"
	-e "$PDB/herdr-watchdog/hb_block.ts"
	--tools read,write,edit,ls,bash,last_answer,hb_block
	--append-system-prompt "$HOME/.pi/agent/pi-rules/reviewer.md"
)
